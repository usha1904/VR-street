<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Architectural VR Showcase</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Preloader Screen -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <h2>Loading 360 Spaces...</h2>
    <p>Open this page inside your Meta Quest Browser and click "Enter VR"</p>
  </div>

  <a-scene webxr="referenceSpaceType: local-floor" loading-screen="enabled: false">
    
    <!-- Direct Asset References (No folder prefix) -->
    <a-assets timeout="10000">
      <img id="scene-bangkok" src="Bagnkok.jpg">
      <img id="scene-arora" src="Arora.jpg">
      <img id="scene-pool" src="Pool.jpg">
    </a-assets>

    <!-- 360 Spherical Viewport -->
    <a-sky id="skybox" src="#scene-arora" rotation="0 -90 0" material="opacity: 1; transparent: true"></a-sky>

    <!-- Headset Rig & Input Controls -->
    <a-entity id="rig" position="0 0 0">
      <a-camera id="camera" position="0 1.6 0">
        <!-- Reticle for Hands-Free / Dwell Selection -->
        <a-cursor
          id="cursor"
          color="#38bdf8"
          fuse="true"
          fuse-timeout="1000"
          raycaster="objects: .clickable"
          geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
          position="0 0 -1"
          animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1000; from: 1 1 1; to: 0.2 0.2 0.2"
          animation__reset="property: scale; startEvents: mouseleave; dur: 200; to: 1 1 1">
        </a-cursor>
      </a-camera>

      <!-- Meta Quest Touch Controller Pointers -->
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 10" line="color: #38bdf8; opacity: 0.8"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 10" line="color: #38bdf8; opacity: 0.8"></a-entity>
    </a-entity>

    <!-- Ergonomic Spatial UI Dock (-10 deg tilt, 2.0m distance) -->
    <a-entity id="ui-dock" position="0 1.3 -2.0" rotation="-10 0 0">
      
      <!-- Dock Backing -->
      <a-plane width="2.4" height="0.85" color="#0f172a" opacity="0.85" class="clickable" material="transparent: true"></a-plane>
      <a-text value="EXPLORE SPACES" align="center" position="0 0.3 0.01" width="2.2" color="#94a3b8" letter-spacing="2"></a-text>

      <!-- Card 1: Bangkok Civic Plaza -->
      <a-entity position="-0.7 -0.05 0.02">
        <a-plane 
          class="clickable ui-card" 
          src="#scene-bangkok" 
          width="0.6" 
          height="0.38" 
          material="color: #ffffff"
          onclick="loadScene('#scene-bangkok')">
        </a-plane>
        <a-text value="Civic Plaza" align="center" position="0 -0.25 0.01" width="1.6" color="#f8fafc"></a-text>
      </a-entity>

      <!-- Card 2: Aurora Landscape -->
      <a-entity position="0 -0.05 0.02">
        <a-plane 
          class="clickable ui-card" 
          src="#scene-arora" 
          width="0.6" 
          height="0.38" 
          material="color: #ffffff"
          onclick="loadScene('#scene-arora')">
        </a-plane>
        <a-text value="Aurora Site" align="center" position="0 -0.25 0.01" width="1.6" color="#f8fafc"></a-text>
      </a-entity>

      <!-- Card 3: Waterfront Pier -->
      <a-entity position="0.7 -0.05 0.02">
        <a-plane 
          class="clickable ui-card" 
          src="#scene-pool" 
          width="0.6" 
          height="0.38" 
          material="color: #ffffff"
          onclick="loadScene('#scene-pool')">
        </a-plane>
        <a-text value="Waterfront Pier" align="center" position="0 -0.25 0.01" width="1.6" color="#f8fafc"></a-text>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    // Remove screen preloader once assets are loaded
    window.addEventListener('load', () => {
      const overlay = document.getElementById('loading-overlay');
      overlay.style.opacity = '0';
      setTimeout(() => overlay.remove(), 500);
    });

    // Scene Transition Engine
    let isTransitioning = false;
    function loadScene(targetAssetId) {
      if (isTransitioning) return;
      
      const sky = document.querySelector('#skybox');
      if (sky.getAttribute('src') === targetAssetId) return;

      isTransitioning = true;

      // Fade out
      sky.setAttribute('animation__fadeout', {
        property: 'material.opacity',
        to: 0,
        dur: 350,
        easing: 'easeInOutQuad'
      });

      // Switch texture and fade back in
      setTimeout(() => {
        sky.setAttribute('src', targetAssetId);
        sky.removeAttribute('animation__fadeout');
        sky.setAttribute('animation__fadein', {
          property: 'material.opacity',
          to: 1,
          dur: 400,
          easing: 'easeInOutQuad'
        });

        setTimeout(() => {
          sky.removeAttribute('animation__fadein');
          isTransitioning = false;
        }, 420);
      }, 360);
    }

    // Interactive button hover scale
    AFRAME.registerComponent('ui-hover-effect', {
      init: function () {
        const el = this.el;
        el.addEventListener('mouseenter', () => {
          el.setAttribute('scale', '1.08 1.08 1.08');
        });
        el.addEventListener('mouseleave', () => {
          el.setAttribute('scale', '1 1 1');
        });
      }
    });

    document.querySelectorAll('.ui-card').forEach(card => {
      card.setAttribute('ui-hover-effect', '');
    });
  </script>
</body>
</html>
