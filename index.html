<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Architectural VR Walkthrough</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene webxr="referenceSpaceType: local-floor">
    <!-- Assets Preloading -->
    <a-assets>
      <img id="view-lobby" src="assets/lobby.jpg">
      <img id="view-auditorium" src="assets/auditorium.jpg">
      <img id="thumb-lobby" src="assets/thumb_lobby.jpg">
      <img id="thumb-aud" src="assets/thumb_aud.jpg">
    </a-assets>

    <!-- 360 Panoramic Background -->
    <a-sky id="skybox" src="#view-lobby" rotation="0 -90 0"></a-sky>

    <!-- Camera and Raycaster for Meta Quest Controllers & Gaze -->
    <a-entity id="rig" position="0 0 0">
      <a-camera id="camera" position="0 1.6 0">
        <!-- Reticle for non-controller/gaze dwell interaction -->
        <a-cursor
          id="cursor"
          color="#ECEFF1"
          fuse="true"
          fuse-timeout="1200"
          raycaster="objects: .clickable"
          geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
          position="0 0 -1">
        </a-cursor>
      </a-camera>

      <!-- Quest Laser Pointers -->
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable" line="color: #00E5FF"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable" line="color: #00E5FF"></a-entity>
    </a-entity>

    <!-- Floating Navigation Menu (Positioned in Ergonomic Comfort Zone) -->
    <a-entity id="ui-panel" position="0 1.2 -2.2" rotation="-10 0 0">
      <!-- Background Panel -->
      <a-plane width="2.2" height="0.9" color="#1E293B" opacity="0.85" class="clickable"></a-plane>

      <!-- Menu Header -->
      <a-text value="SELECT SPACE" align="center" position="0 0.32 0.02" width="2.4" color="#F8FAFC"></a-text>

      <!-- Thumbnail Button 1: Lobby -->
      <a-plane 
        class="clickable" 
        src="#thumb-lobby" 
        position="-0.55 -0.05 0.03" 
        width="0.8" 
        height="0.45" 
        onclick="switchScene('#view-lobby')">
        <a-text value="Entrance Lobby" align="center" position="0 -0.28 0.01" width="1.6" color="#FFFFFF"></a-text>
      </a-plane>

      <!-- Thumbnail Button 2: Auditorium -->
      <a-plane 
        class="clickable" 
        src="#thumb-aud" 
        position="0.55 -0.05 0.03" 
        width="0.8" 
        height="0.45" 
        onclick="switchScene('#view-auditorium')">
        <a-text value="Auditorium" align="center" position="0 -0.28 0.01" width="1.6" color="#FFFFFF"></a-text>
      </a-plane>
    </a-entity>

    <!-- Floor Waypoint Hotspot (Walkway Navigation) -->
    <a-ring 
      class="clickable"
      position="1.5 0.05 -3.0" 
      rotation="-90 0 0" 
      radius-inner="0.25" 
      radius-outer="0.45" 
      color="#00E5FF" 
      opacity="0.8"
      onclick="switchScene('#view-auditorium')">
      <a-text value="Walk to Auditorium" align="center" position="0 0 0.5" rotation="90 0 0" width="2" color="#FFFFFF"></a-text>
    </a-ring>
  </a-scene>

  <script>
    function switchScene(imageSelector) {
      const sky = document.querySelector('#skybox');
      // Smooth fade transition
      sky.setAttribute('animation__fadeout', {
        property: 'material.opacity',
        to: 0,
        dur: 300,
        easing: 'easeInOutQuad'
      });

      setTimeout(() => {
        sky.setAttribute('src', imageSelector);
        sky.setAttribute('animation__fadein', {
          property: 'material.opacity',
          to: 1,
          dur: 400,
          easing: 'easeInOutQuad'
        });
      }, 320);
    }
  </script>
</body>
</html>
